services:
  - type: web
    name: citespect
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && gcc -Wall -Wextra -std=c99 -Ibackend/include backend/src/*.c -o backend/citespect
    startCommand: gunicorn --chdir bridge app:app --bind 0.0.0.0:$PORT --timeout 180
    envVars:
      - key: OPENALEX_API_KEY
        sync: false
